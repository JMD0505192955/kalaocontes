server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 12M;      # le contenu éditorial est volumineux
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # ---- l'API, sur la même adresse : plus de question d'origine croisée ----
  location /api/ {
    proxy_pass         http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # ---- le back office et le portail partenaire ne sont pas publics ----
  location = /admin.html      { auth_basic "Administration"; auth_basic_user_file /etc/nginx/.htpasswd; try_files $uri =404; }
  location = /partenaire.html { auth_basic "Partenaires";    auth_basic_user_file /etc/nginx/.htpasswd; try_files $uri =404; }

  # ---- les voix et les images ne changent jamais : on les garde longtemps ----
  location ~* \.(mp3|webp|png|jpg|woff2)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # ---- le portail change à chaque publication : jamais de cache ----
  location ~* \.(html|json)$ {
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate";
  }

  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options SAMEORIGIN;
  add_header Referrer-Policy strict-origin-when-cross-origin;
}
